name: Python tests and package verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents cli.py dose_response.py doseresponse_meta.py enrichment.py simulator.py
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('web/index.html').read_text(encoding='utf-8')
          inline = text.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/spline-browser.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/spline-browser.js
      - name: Run tests
        run: python -m pytest -v
      - name: Verify installed CLI entry point
        run: spline-dose-response --help
